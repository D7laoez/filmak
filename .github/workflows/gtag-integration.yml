name: gtag integration test

# يعمل على كل push وعلى Pull Requests قبل الدمج (وبالتالي قبل النشر عبر Lovable).
# النشر في Lovable ينطلق تلقائياً عند push، لذلك هذا الـ workflow يعمل بالتوازي
# ويفشل بوضوح إذا انكسر تحميل gtag — ما يعطيك إشارة سريعة قبل مشاركة الرابط.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  gtag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Start dev server
        run: |
          nohup bun run dev --host 127.0.0.1 --port 8080 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid

          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done

          echo "server failed"
          cat /tmp/preview.log
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Run gtag integration test
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
        run: python tests/gtag.spec.py

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill "$(cat /tmp/preview.pid)" || true; fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtag-screenshots
          path: /tmp/browser/gtag
          if-no-files-found: ignore
